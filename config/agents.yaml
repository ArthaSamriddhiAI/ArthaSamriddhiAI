# Agent registry config — cluster 5 chunk 5.2.
#
# This file is the single source of truth for which agents the system
# expects to be authored. The Python registry
# (`artha.api_v2.m0.registry.CANONICAL_AGENTS`) mirrors this list;
# `validate_inventory()` cross-checks this YAML against the on-disk
# skill.md set at startup and flags drift.
#
# Per FR Entry 20.2 §10.3: every entry here MUST have a corresponding
# `config/skills/<agent_id>.md` file. Deferred agents still need their
# skill.md draft on disk — `deferred=True` only changes runtime
# dispatch.

version: "1.0"
authored_in_cluster: 5

